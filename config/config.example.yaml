# QuantTrading 설정 서식 — config/config.yaml 과 동일 내용 (동기 유지). 시크릿은 .env 별도
# 모든 수치 파라미터는 이 파일에서만 관리한다 (DECISIONS.md 원칙 4, CLAUDE.md PART D)

account:            # 계좌 통합 파라미터
  seed: 5_000_000
  alloc: {day: 0.3, swing: 0.7}
  kill_switch: {soft: -0.03, hard: -0.05}      # 2개월 무사고 후 -0.04/-0.06
  drawdown: {per_strategy: -0.15, account: -0.18}  # 오디션 MDD 확정 후 재설정
common:             # 시장 무관 공식·규칙
  risk_per_trade: {day: 0.01, swing: 0.015}
  fill_model: pessimistic
markets:
  kospi:            # 코스피 인스턴스 파라미터 (2026 변동성 국면 보정값)
    timezone: Asia/Seoul
    sessions:       # 세션 테이블 — 1급 구조 (결정 9). 전부 정의하되 거래 활성은 tradable로 통제. 2026-09-14 제도 개편 반영 (ARCHITECTURE.md 5절)
      - {name: auction_open,  span: "08:30-09:00", kind: auction,    tradable: false}
      - {name: continuous,    span: "09:00-15:20", kind: continuous, tradable: true}   # v1 유일 거래 세션
      - {name: auction_close, span: "15:20-15:30", kind: auction,    tradable: false}
      - {name: after_fixed,   span: "15:40-16:00", kind: fixed,      tradable: false}  # 존치 여부 확인 필요 (DECISIONS.md 11절)
      - {name: aftermarket,   span: "16:00-20:00", kind: continuous, tradable: false}  # KRX 애프터마켓 (2026-09-14~, 시간외단일가 대체). 수집 대상
      # KRX 프리마켓은 추후 도입 보도 — 시행 확인 후 추가
    day:  {stop: {mode: vol_linked, mult: 0.5, clamp: [-0.03, -0.06]}, max_positions: 1, price_cap: 200_000}
    swing: {stop: -0.15, positions: 7, price_cap: 160_000, leverage_slot: {max_ratio: 0.5, stop: -0.20}}
    universe:       # 미확정 — DECISIONS.md 11절 참조
  us:               # 미국 인스턴스 — 독자 백테스트로 별도 확정 (미정)
    timezone: America/New_York   # 세션은 현지 시간대로 정의, 서머타임은 라이브러리가 처리
calendar:           # 미확정 — DECISIONS.md 11절 참조 (시장 캘린더 — 휴장일·단축일·변경일, 소스 미정)
parking:
  whitelist:        # 미확정 — DECISIONS.md 11절 참조
  enabled_for: [swing]
personal_bot:       # 개인 자동화 봇 (결정 8·9)
  blocked: derived  # 활성 인스턴스의 거래 세션 합집합 + 전후 버퍼 (고정값 기입 금지)
  buffer_minutes: 30

collector:          # 분봉 스윕 수집기 (결정 11) — 마감 후 REST 일괄 스윕
  market: kospi
  kind: intraday_1m
  sweep_after: "20:30"          # k12 타이머 실행 시각 (거래소 현지시각). deploy/systemd/collector.timer 의 OnCalendar 와 반드시 일치시킬 것
  sessions: [continuous, auction_close, after_fixed, aftermarket]   # 수집 창 = 이 세션들의 최소 시작(09:00) ~ 최대 종료(20:00). 시가 단일가(08:30~09:00)는 분봉 없음
  rate_per_sec:                 # 초당 호출 한도 (한국투자증권 공지 "API 호출 유량 안내" 2026-04-20 기준: 실전 18건/초, 모의 1건/초 — 0-A 실측 EGW00201 로 확인)
    real: 15                    # 실측 한도 18 대비 3건 여유 (분산 정책·재시도 몫)
    paper: 1                    # 실측 한도 1 그대로 (여유 없음 → 리미터가 정확히 1초 간격 유지, 초과 시 EGW00201 재시도)
  api:
    tr_id: FHKST03010200        # 주식당일분봉조회 (1회 최대 30건, 당일만 제공)
    path: /uapi/domestic-stock/v1/quotations/inquire-time-itemchartprice
    market_div_code: J          # J: KRX
    include_past: "Y"           # FID_PW_DATA_INCU_YN — 기준시각 이전 행 포함(내림차순)
    page_size: 30
  db_path: data/quant_trading.sqlite3   # 저장소 루트 기준 상대 경로 (data/ 는 git 제외)
  max_pages_margin: 2           # 최대 페이지 = ceil(수집 창 분 수 / page_size) + margin
  probe_symbols: 5              # 거래일 판별에 시도할 선두 종목 수
  progress_log_every: 50        # 진행 로그 간격(종목 수)
  symbol_source: {provider: pykrx, market: KOSPI}   # pykrx get_market_ticker_list(date, market). KRX 로그인(KRX_ID/KRX_PW)은 .env
  notify: {discord: true}       # 스윕 종료 시 collector_log 집계 한 줄 전송 (웹훅 미설정 시 경고 로그만)

broker:
  kis:
    default_env: paper          # 랩실 기본. k12 수집기는 --env real (결정 11: k12 내 실전 키 시세 조회 승인)
    real:  {base_url: "https://openapi.koreainvestment.com:9443",     key_env: KIS_REAL_KEY,  secret_env: KIS_REAL_SECRET}
    paper: {base_url: "https://openapivts.koreainvestment.com:29443", key_env: KIS_PAPER_KEY, secret_env: KIS_PAPER_SECRET}
    token:
      path: /oauth2/tokenP
      cache_dir: data           # kis_token_<env>.json (0600). 유효기간 24시간, 6시간 내 재발급 시 동일 토큰 반환(공식 문서)
      timezone: Asia/Seoul      # 서버가 돌려주는 만료 시각 문자열의 시간대
      refresh_margin_minutes: 30  # 만료 30분 전부터 재발급
      issue_retry_wait_sec: 61  # 발급 1분당 1회 제한(EGW00133) 시 대기 후 1회 재시도
      issue_limit_codes: [EGW00133]
      expired_codes: [EGW00123] # 만료 토큰 응답 코드 — 해당 시 캐시 무효화 후 1회 재발급
    rate_limit_codes: [EGW00201]  # 초당 거래건수 초과 — 백오프 재시도
    timeout_sec: 15
    max_retries: 3
    retry_backoff_sec: 2.0

notify:
  discord:
    webhook_env: DISCORD_WEBHOOK_URL   # 값은 .env
    timeout_sec: 10
